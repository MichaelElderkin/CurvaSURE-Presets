<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CurvaSURE — Preset Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Palette matches the app's cosmo_mod theme:
     bg #f3f3f3 · cards #fff · text #373a3c · primary #5aa1d4 · value-blue #3C85C8 */
  :root{
    --bg:#f3f3f3;
    --card:#ffffff;
    --card-alt:#F8F9FA;
    --ink:#373a3c;
    --muted:#7E8081;
    --border:#ced4da;
    --border-soft:#e6e8eb;
    --accent:#5aa1d4;
    --accent-deep:#3C85C8;
    --accent-wash:#eaf3fb;
    --warning:#ff7518;
    --radius:6px;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.5;
  }
  .wrap{max-width:820px;margin:0 auto;padding:32px 22px 80px;}

  /* ─ Header ─ */
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;}
  .logo{display:block;height:auto;width:330px;max-width:100%;margin:0;flex:0 1 auto;}
  .header-right{text-align:right;flex:0 0 auto;margin-left:auto;}
  .eyebrow{
    margin:0;font-size:28px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;color:var(--accent-deep);line-height:1.05;
  }
  .count{margin:7px 0 0;font-size:18px;color:var(--muted);}
  .count b{color:var(--accent-deep);font-weight:600;}

  /* ─ Controls ─ */
  .controls{
    margin-top:22px;display:flex;flex-wrap:wrap;gap:9px;align-items:center;
    border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:13px 0;
  }
  .search{position:relative;flex:1 1 240px;min-width:0;}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:15px;height:15px;color:var(--muted);pointer-events:none;}
  .search input{
    width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:9px 12px 9px 33px;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .search input::placeholder{color:var(--muted);}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash);}

  .btn{
    font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink);
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:9px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    transition:background .15s,border-color .15s;white-space:nowrap;
  }
  .btn:hover{background:var(--card-alt);border-color:var(--muted);}
  .btn:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash);}
  .btn svg{width:14px;height:14px;}
  .btn.spin svg{animation:rot .8s linear infinite;}
  @keyframes rot{to{transform:rotate(360deg);}}

  .meta-line{margin-top:10px;font-size:12px;color:var(--muted);min-height:16px;}
  .meta-line .ok{color:var(--accent-deep);}
  .meta-line .warn{color:var(--warning);}

  /* ─ Catalogue ─ */
  #catalogue{margin-top:6px;}
  .cat{
    margin-top:12px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);overflow:hidden;
    opacity:0;transform:translateY(5px);animation:rise .35s ease forwards;
  }
  @keyframes rise{to{opacity:1;transform:none;}}

  .cat-head{
    display:flex;align-items:center;gap:11px;width:100%;
    padding:13px 15px;background:none;border:none;cursor:pointer;text-align:left;
    font-family:inherit;color:inherit;
  }
  .cat-head:hover{background:var(--card-alt);}
  .cat-head:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent-wash);}
  .chev{flex:0 0 auto;width:12px;height:12px;color:var(--muted);transition:transform .2s ease;}
  .cat.open .chev{transform:rotate(90deg);}
  .cat-name{
    font-size:15px;font-weight:600;color:var(--ink);flex:1 1 auto;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .cat-count{font-size:13px;color:var(--muted);font-weight:500;flex:0 0 auto;}

  .cat-body{display:none;padding:2px 15px 10px;}
  .cat.open .cat-body{display:block;}

  .maker{margin:2px 0;padding-left:14px;position:relative;}
  .maker::before{
    content:"";position:absolute;left:2px;top:8px;bottom:6px;width:2px;
    background:var(--accent);border-radius:2px;opacity:.7;
  }
  .maker-head{display:flex;align-items:baseline;gap:9px;padding:9px 2px 5px;}
  .maker-name{font-size:12.5px;font-weight:600;color:var(--accent-deep);letter-spacing:.01em;}
  .maker-name.nomaker{color:var(--muted);}
  .maker-count{font-size:11.5px;color:var(--muted);}
  .maker-rule{flex:1 1 auto;height:1px;background:var(--border-soft);align-self:center;}

  .rows{display:flex;flex-direction:column;}
  .row{
    padding:6px 9px;border-radius:5px;font-size:14px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .12s;
  }
  .row:hover{background:var(--accent-wash);}
  .row mark{background:#d7ebfa;color:var(--accent-deep);border-radius:3px;padding:0 1px;}

  /* ─ States ─ */
  .state{margin-top:36px;text-align:center;color:var(--muted);font-size:13px;padding:30px 20px;}
  .state .big{font-size:15px;color:var(--ink);margin-bottom:8px;font-weight:600;}
  .state .loader{
    width:26px;height:26px;margin:0 auto 15px;border-radius:50%;
    border:2px solid var(--border);border-top-color:var(--accent);animation:rot .8s linear infinite;
  }
  .state .btn{margin-top:16px;}
  .empty{margin-top:26px;text-align:center;font-size:13.5px;color:var(--muted);padding:28px;}

  footer{
    margin-top:40px;padding-top:15px;border-top:1px solid var(--border);
    font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  footer a{color:var(--accent-deep);text-decoration:none;}
  footer a:hover{text-decoration:underline;}

  @media (max-width:520px){ .logo{max-width:280px;} .cat-name{font-size:14px;} }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  }
</style>
</head>

      <p class="count"><b id="t-presets">—</b> presets</p>
    </div>
  </header>

  <div class="controls">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="search" placeholder="Search presets…" autocomplete="off" spellcheck="false" aria-label="Search presets">
    </label>
    <button class="btn" id="sortBtn" title="Toggle preset order">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h12M3 12h9M3 18h6"/><path d="M18 9l3-3 3 3M21 6v12"/></svg>
      <span id="sortLbl">Repo order</span>
    </button>
    <button class="btn" id="toggleBtn" title="Expand or collapse all">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 10l5 5 5-5"/></svg>
      <span id="toggleLbl">Expand all</span>
    </button>
    <button class="btn" id="refreshBtn" title="Fetch the latest presets">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 4v5h-5"/></svg>
      <span>Refresh</span>
    </button>
  </div>
  <div class="meta-line" id="metaLine"></div>

  <main id="catalogue"></main>

  <footer>
    <span>Live from the CurvaSURE preset repository</span>
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* Same manifest the app loads. Pages first, raw fallback.
     Update these if the manifest version changes. */
  var MANIFEST_URLS = [
    "https://michaelelderkin.github.io/CurvaSURE-Presets/all_curvasure_presets_v4_0_0.json",
    "https://raw.githubusercontent.com/michaelelderkin/CurvaSURE-Presets/main/all_curvasure_presets_v4_0_0.json"
  ];
  var META_KEYS = {category_defaults:1, category_options:1};

  /* Category display order, matching the app's desired_category_order.
     "Defaults" is excluded from this view. Any category not listed here
     is appended after these, in natural-sorted order. */
  var CATEGORY_ORDER = [
    "Oboe", "Oboe d'amore", "Historical Oboe", "Cor Anglais",
    "Bass Oboe", "Heckelphone", "Bassoon", "Historical Bassoon",
    "Contrabassoon", "Contraforte", "Subcontrabassoon", "Custom", "Downloaded"
  ];
  var EXCLUDE_CATEGORIES = {Defaults:1};

  var els = {
    cat: document.getElementById('catalogue'),
    meta: document.getElementById('metaLine'),
    search: document.getElementById('search'),
    refresh: document.getElementById('refreshBtn'),
    toggle: document.getElementById('toggleBtn'),
    toggleLbl: document.getElementById('toggleLbl'),
    sort: document.getElementById('sortBtn'),
    sortLbl: document.getElementById('sortLbl'),
    tPresets: document.getElementById('t-presets')
  };

  var state = { model:null, sortAZ:false, query:"" };

  function isPreset(v){
    return v && typeof v === 'object' && !Array.isArray(v) &&
      ('points' in v || 'params' in v || 'version' in v);
  }

  /* model: [{name, count, makers:[{name,isNone,presets:[name,...]}]}] */
  function buildModel(raw){
    var cats = [];
    Object.keys(raw).forEach(function(catName){
      if(EXCLUDE_CATEGORIES[catName]) return;
      var contents = raw[catName];
      if(!contents || typeof contents !== 'object') return;
      var makers = [];
      var loose = { name:'—', isNone:true, presets:[] };
      Object.keys(contents).forEach(function(key){
        if(META_KEYS[key]) return;
        var val = contents[key];
        if(isPreset(val)){
          loose.presets.push(key);
        } else if(val && typeof val === 'object'){
          var group = { name:key, isNone:false, presets:[] };
          Object.keys(val).forEach(function(pk){ if(isPreset(val[pk])) group.presets.push(pk); });
          if(group.presets.length) makers.push(group);
        }
      });
      if(loose.presets.length) makers.unshift(loose);
      var total = makers.reduce(function(s,m){return s + m.presets.length;},0);
      if(total > 0) cats.push({ name:catName, makers:makers, count:total });
    });

    // Order to match the program: listed categories first (in that order),
    // then any others appended in natural-sorted order.
    cats.sort(function(a,b){
      var ia = CATEGORY_ORDER.indexOf(a.name), ib = CATEGORY_ORDER.indexOf(b.name);
      if(ia < 0 && ib < 0) return a.name.localeCompare(b.name, undefined, {numeric:true});
      if(ia < 0) return 1;
      if(ib < 0) return -1;
      return ia - ib;
    });
    return cats;
  }

  function escapeHtml(s){
    return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});
  }
  function highlight(name, q){
    var safe = escapeHtml(name);
    if(!q) return safe;
    var i = name.toLowerCase().indexOf(q);
    if(i < 0) return safe;
    return escapeHtml(name.slice(0,i)) + '<mark>' + escapeHtml(name.slice(i,i+q.length)) + '</mark>' + escapeHtml(name.slice(i+q.length));
  }

  function tallies(cats){
    els.tPresets.textContent = cats.reduce(function(s,c){return s + c.count;},0);
  }

  function render(){
    var q = state.query.trim().toLowerCase();
    var cats = state.model || [];
    var frag = document.createDocumentFragment();
    var shown = 0, i = 0;

    cats.forEach(function(cat){
      var catMatches = cat.name.toLowerCase().indexOf(q) >= 0;
      var makersOut = [];
      cat.makers.forEach(function(m){
        var makerMatches = catMatches || (!m.isNone && m.name.toLowerCase().indexOf(q) >= 0);
        var ps = m.presets.filter(function(p){ return !q || makerMatches || p.toLowerCase().indexOf(q) >= 0; });
        if(state.sortAZ){
          ps = ps.slice().sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true});});
        }
        if(ps.length) makersOut.push({ maker:m, presets:ps });
      });
      if(!makersOut.length) return;

      var vis = makersOut.reduce(function(s,x){return s + x.presets.length;},0);
      shown += vis;

      var open = q ? true : (cat._open === true);

      var section = document.createElement('section');
      section.className = 'cat' + (open ? ' open' : '');
      section.style.animationDelay = (i*34) + 'ms';
      i++;

      var head = document.createElement('button');
      head.className = 'cat-head';
      head.setAttribute('aria-expanded', open ? 'true':'false');
      head.innerHTML =
        '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>' +
        '<span class="cat-name">' + highlight(cat.name, q) + '</span>' +
        '<span class="cat-count">' + vis + '</span>';
      head.addEventListener('click', function(){
        var nowOpen = !section.classList.contains('open');
        cat._open = nowOpen;
        section.classList.toggle('open', nowOpen);
        head.setAttribute('aria-expanded', nowOpen ? 'true':'false');
      });
      section.appendChild(head);

      var body = document.createElement('div');
      body.className = 'cat-body';
      makersOut.forEach(function(x){
        var m = x.maker;
        var mk = document.createElement('div');
        mk.className = 'maker';
        var mkName = m.isNone ? 'Individual' : escapeHtml(m.name);
        mk.innerHTML =
          '<div class="maker-head">' +
            '<span class="maker-name' + (m.isNone?' nomaker':'') + '">' + (q && !m.isNone ? highlight(m.name,q) : mkName) + '</span>' +
            '<span class="maker-count">' + x.presets.length + '</span>' +
            '<span class="maker-rule"></span>' +
          '</div>';
        var rows = document.createElement('div');
        rows.className = 'rows';
        x.presets.forEach(function(p){
          var row = document.createElement('div');
          row.className = 'row';
          row.title = p;
          row.innerHTML = highlight(p, q);
          rows.appendChild(row);
        });
        mk.appendChild(rows);
        body.appendChild(mk);
      });
      section.appendChild(body);
      frag.appendChild(section);
    });

    els.cat.innerHTML = '';
    if(!shown){
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = q ? ('No presets match “' + state.query.trim() + '”.') : 'No presets found in the repository.';
      els.cat.appendChild(empty);
    } else {
      els.cat.appendChild(frag);
    }
  }

  function showLoading(){
    els.cat.innerHTML =
      '<div class="state"><div class="loader"></div>' +
      '<div class="big">Fetching the latest presets…</div>' +
      '<div>Reading the live manifest from the repository.</div></div>';
  }
  function showError(detail){
    var d = document.createElement('div');
    d.className = 'state';
    d.innerHTML = '<div class="big">Couldn’t reach the preset repository.</div><div>' + escapeHtml(detail || 'The manifest didn’t load.') + '</div>';
    var b = document.createElement('button');
    b.className = 'btn';
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 4v5h-5"/></svg><span>Try again</span>';
    b.addEventListener('click', load);
    d.appendChild(b);
    els.cat.innerHTML = '';
    els.cat.appendChild(d);
  }

  function nowStr(){
    return new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }

  function fetchManifest(){
    var errs = [];
    function tryAt(idx){
      if(idx >= MANIFEST_URLS.length) return Promise.reject(new Error(errs.join(' · ') || 'All sources failed'));
      return fetch(MANIFEST_URLS[idx], {cache:'no-store'})
        .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .catch(function(e){ errs.push(e.message); return tryAt(idx+1); });
    }
    return tryAt(0);
  }

  function load(){
    els.refresh.classList.add('spin');
    els.meta.innerHTML = 'Contacting repository…';
    showLoading();
    fetchManifest().then(function(json){
      state.model = buildModel(json);
      tallies(state.model);
      render();
      els.meta.innerHTML = '<span class="ok">✓ Updated ' + nowStr() + '</span>';
    }).catch(function(err){
      showError(err.message);
      els.meta.innerHTML = '<span class="warn">✗ Update failed ' + nowStr() + '</span>';
    }).then(function(){
      els.refresh.classList.remove('spin');
    });
  }

  var searchTimer;
  els.search.addEventListener('input', function(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){ state.query = els.search.value; render(); }, 90);
  });
  els.sort.addEventListener('click', function(){
    state.sortAZ = !state.sortAZ;
    els.sortLbl.textContent = state.sortAZ ? 'A – Z' : 'Repo order';
    render();
  });
  els.toggle.addEventListener('click', function(){
    if(!state.model) return;
    var anyClosed = state.model.some(function(c){return c._open !== true;});
    state.model.forEach(function(c){ c._open = anyClosed; });
    els.toggleLbl.textContent = anyClosed ? 'Collapse all' : 'Expand all';
    render();
  });
  els.refresh.addEventListener('click', load);

  load();
})();
</script>
</body>
</html>

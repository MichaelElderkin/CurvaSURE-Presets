# .github/workflows/update-preset-index.yml
#
# Rebuilds preset_index.json (names only) whenever the preset manifest changes,
# and commits it back to the repository. GitHub Pages then republishes it, so the
# public Preset Index page always shows the current list without touching the
# full manifest.
#
# Requires: make_preset_index.py in the repository root.
 
name: Update preset index
 
on:
  push:
    branches: [main]
    paths:
      - "all_curvasure_presets_v*.json"   # the manifest(s) the app publishes to
      - "make_preset_index.py"
  workflow_dispatch:                       # "Run workflow" button in the Actions tab
 
permissions:
  contents: write
 
jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Build names-only index from the manifest in this repo
        run: python make_preset_index.py all_curvasure_presets_v5_0_0.json
 
      - name: Commit the index if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preset_index.json
          git diff --cached --quiet && echo "Index unchanged." && exit 0
          git commit -m "Update preset index (names only)"
          git push
 
